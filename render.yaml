services:
  - type: web
    name: college-ai-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed_documents.py; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/backend/chroma_db
      - key: DOCS_DIR
        value: /opt/render/project/src/backend/documents
      - key: ADMIN_API_KEY
        sync: false
      - key: COLLEGE_NAME
        value: O.P. Jindal Global University
      - key: COLLEGE_SHORT_NAME
        value: JGU
      - key: ALLOWED_ORIGINS
        value: "*"
    # NOTE: no persistent disk on the free plan (disks require a paid plan), so
    # chroma_db/ and documents/ live on ephemeral storage and are wiped on every
    # deploy and every free-tier spin-down/restart. The startCommand above runs
    # `python seed_documents.py` automatically on every boot to re-index
    # backend/data/ before the API starts - no manual Shell step needed (Shell
    # access itself is a paid-plan feature on Render). Embeddings use the
    # Gemini API (not a local model) to stay within the free tier's 512MB RAM.

  - type: web
    name: college-ai-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://college-ai-assistant-api.onrender.com