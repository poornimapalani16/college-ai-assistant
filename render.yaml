services:
  - type: web
    name: college-ai-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: DOCS_DIR
        value: ./documents
      - key: ADMIN_API_KEY
        sync: false
      - key: COLLEGE_NAME
        value: O.P. Jindal Global University
      - key: COLLEGE_SHORT_NAME
        value: JGU
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: college-ai-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://college-ai-assistant-api.onrender.com